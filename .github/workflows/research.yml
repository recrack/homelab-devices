name: Verify research draft PR publishing
on: workflow_dispatch
permissions: {}
jobs:
  propose:
    if: github.repository == 'recrack/homelab-devices' && github.ref == 'refs/heads/verify/research-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Replay the previously validated findings using the production publisher
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_ISSUE: "2"
        run: |
          report="$(mktemp)"
          gh api 'repos/recrack/homelab-devices/contents/research/verified/issue-2.md?ref=ec710f1' --jq .content | base64 -d > "$report"
          export RESEARCH_FINDINGS="$(python3 -B - "$report" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          report = Path(sys.argv[1]).read_text()
          sections = re.findall(
              r"^## (.+)\n\n- 확인 내용 · (.+)\n- 근거 범위 · (.+)\n- 출처 · (.+) <([^>]+)>$",
              report,
              re.M,
          )
          assert len(sections) == 3
          keys = ("model", "finding", "limits", "source", "url")
          print(json.dumps([dict(zip(keys, row)) for row in sections]))
          PY
          )"
          python3 scripts/research.py publish
